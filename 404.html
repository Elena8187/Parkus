<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | PARKUS</title>
<script>
/* Any capitalization of a page address (for example /LPR or /Privacy) opens the lowercase page */
(function(){var p=location.pathname,l=p.toLowerCase();if(p!==l){location.replace(l+location.search+location.hash);}})();
</script>
<style>
:root{--cyan:#00D9E8;--graphite:#101419;--soft:#A9B5BF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--graphite);color:#fff;font:400 17px/1.6 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font:900 28px/1 "Archivo","Arial Narrow",Arial,sans-serif;color:#fff;text-decoration:none;margin-bottom:28px}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--cyan);color:var(--graphite);font-style:normal;font-size:20px}
h1{margin:0 0 10px;font:900 clamp(40px,8vw,72px)/1 "Archivo","Arial Narrow",Arial,sans-serif;text-transform:uppercase}
h1 em{font-style:normal;color:var(--cyan)}
p{color:var(--soft);margin:0 0 28px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:var(--cyan);color:var(--graphite);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <a class="logo home" href="/"><i aria-hidden="true">P</i>PARKUS</a>
  <h1>Page <em>not found</em></h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a class="btn home" href="/">Back to PARKUS</a>
</main>
<script>
/* On a project preview address (name.github.io/parkus/) send "home" to the project root */
(function(){if(/\.github\.io$/.test(location.hostname)){var seg=location.pathname.split('/')[1];if(seg){document.querySelectorAll('.home').forEach(function(a){a.href='/'+seg+'/';});}}})();
</script>
</body>
</html>
